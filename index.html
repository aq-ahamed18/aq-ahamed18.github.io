  <!-- Prevent Light/Dark Theme Flash Before First Paint -->
  <script>
    (function () {

        }

        // Default cleanly to light mode if localStorage is restricted
      }

  <!-- Modern Bento-Grid Executive Palette (Navy & Burgundy) + Light/Dark Design Tokens -->
  <style>
    /* =========================================================================
       LIGHT MODE (DEFAULT) — Crisp Cool Alabaster Canvas & Pure White Bento Tiles
       ========================================================================= */
    :root,
    [data-theme="light"] {
      --bg-canvas: #F3F5F9;
      --bg-tile: #FFFFFF;
      --bg-tile-subtle: #F7F9FC;
      --bg-nav: rgba(243, 245, 249, 0.84);
      --bg-featured: #0E1C3D;
      --bg-featured-elevated: #162954;

      --text-primary: #0E1C3D;
      --text-secondary: #4B5568;
      --text-muted: #64748B;

      --brand-navy: #0E1C3D;
      --brand-navy-hover: #172B59;
      --accent-burgundy: #7F1D34;
      --accent-burgundy-hover: #69162A;
      --accent-burgundy-soft: rgba(127, 29, 52, 0.08);
      --accent-burgundy-border: rgba(127, 29, 52, 0.22);

      --border-tile: rgba(15, 29, 64, 0.08);
      --border-tile-hover: rgba(127, 29, 52, 0.28);
      --border-featured: rgba(255, 255, 255, 0.12);

      --shadow-tile: 0 1px 3px rgba(15, 29, 64, 0.04), 0 8px 24px -12px rgba(15, 29, 64, 0.06);
      --shadow-tile-hover: 0 4px 12px rgba(15, 29, 64, 0.06), 0 14px 30px -12px rgba(15, 29, 64, 0.12);
      --portrait-backdrop: linear-gradient(160deg, #E9EEF6 0%, #DFE6F1 55%, #EBE2E6 100%);
      --status-dot: #10B981;
      --focus-ring: rgba(127, 29, 52, 0.45);
    }

    /* =========================================================================
       DARK MODE — Midnight Executive Navy & Luminous Rose-Burgundy Accents
       ========================================================================= */
    [data-theme="dark"] {
      --bg-canvas: #080D1A;
      --bg-tile: #10192D;
      --bg-tile-subtle: #15213A;
      --bg-nav: rgba(8, 13, 26, 0.84);
      --bg-featured: linear-gradient(145deg, #162444 0%, #1F1730 100%);
      --bg-featured-elevated: rgba(255, 255, 255, 0.06);

      --text-primary: #F1F5F9;
      --text-secondary: #A3B1C6;
      --text-muted: #7889A3;

      --brand-navy: #E2E8F0;
      --brand-navy-hover: #FFFFFF;
      --accent-burgundy: #E05A76;
      --accent-burgundy-hover: #EC728C;
      --accent-burgundy-soft: rgba(224, 90, 118, 0.14);
      --accent-burgundy-border: rgba(224, 90, 118, 0.32);

      --border-tile: rgba(255, 255, 255, 0.08);
      --border-tile-hover: rgba(224, 90, 118, 0.35);
      --border-featured: rgba(224, 90, 118, 0.28);

      --shadow-tile: 0 2px 10px rgba(0, 0, 0, 0.28), 0 10px 28px -14px rgba(0, 0, 0, 0.48);
      --shadow-tile-hover: 0 8px 24px rgba(0, 0, 0, 0.42), 0 16px 36px -14px rgba(0, 0, 0, 0.56);
      --portrait-backdrop: linear-gradient(160deg, #162442 0%, #111B33 60%, #241628 100%);
      --status-dot: #34D399;
      --focus-ring: rgba(224, 90, 118, 0.55);
    }

    /* Base Styling & Theme Transitions */
    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      transition: background-color 220ms ease, color 220ms ease;
    }

    /* Accessible Focus Rings */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Section Anchor Offset for Sticky Navigation */
    section[id],
    footer[id] {
      scroll-margin-top: 5.5rem;
    }

    /* Core Bento Tile Architecture */
    .bento-tile {
      background-color: var(--bg-tile);
      border: 1px solid var(--border-tile);
      border-radius: 22px;
      box-shadow: var(--shadow-tile);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 220ms ease,
                  box-shadow 220ms ease,
                  background-color 220ms ease;
    }

    .bento-tile-hover:hover {
      transform: translateY(-2px);
      border-color: var(--border-tile-hover);
      box-shadow: var(--shadow-tile-hover);
    }

    /* Featured Focal Bento Tile (Deep Navy in Light / Rich Navy-Burgundy in Dark) */
    .bento-featured {
      background: var(--bg-featured);
      border: 1px solid var(--border-featured);
      border-radius: 22px;
      color: #F8FAFC;
      box-shadow: var(--shadow-tile);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 220ms ease,
                  box-shadow 220ms ease;
    }

    .bento-featured-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-tile-hover);
    }

    /* Burgundy Accent Border Tile */
    .bento-burgundy-edge {
      background-color: var(--bg-tile);
      border: 1px solid var(--accent-burgundy-border);
      border-radius: 22px;
      box-shadow: var(--shadow-tile);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 220ms ease,
                  box-shadow 220ms ease,
                  background-color 220ms ease;
    }
    .bento-burgundy-edge:hover {
      transform: translateY(-2px);
      border-color: var(--accent-burgundy);
      box-shadow: var(--shadow-tile-hover);
    }

    /* Navigation Bar Active Pill */
    .nav-pill {
      color: var(--text-secondary);
      transition: color 180ms ease, background-color 180ms ease;
    }
    .nav-pill:hover {
      color: var(--text-primary);
      background-color: var(--bg-tile-subtle);
    }
    .nav-pill.is-active {
      color: var(--accent-burgundy);
      background-color: var(--accent-burgundy-soft);
      font-weight: 600;
    }

    /* Primary & Secondary Executive Buttons */
    .btn-primary {
      background-color: #0E1C3D;
      color: #FFFFFF;
      border: 1px solid #0E1C3D;
      transition: background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }
    .btn-primary:hover {
      background-color: #7F1D34;
      border-color: #7F1D34;
      transform: translateY(-1px);
    }
    [data-theme="dark"] .btn-primary {
      background-color: #E05A76;
      border-color: #E05A76;
      color: #080D1A;
    }
    [data-theme="dark"] .btn-primary:hover {
      background-color: #EC728C;
      border-color: #EC728C;
    }

    .btn-secondary {
      background-color: var(--bg-tile-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-tile);
      transition: border-color 180ms ease, color 180ms ease, background-color 180ms ease, transform 180ms ease;
    }
    .btn-secondary:hover {
      border-color: var(--accent-burgundy-border);
      color: var(--accent-burgundy);
      transform: translateY(-1px);
    }

    /* Case Study Modal Entrance */
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-card-animate {
      animation: modalIn 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Subtle Section Entrance Reveal */
    .reveal-section {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1), transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal-section {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
      .bento-tile, .bento-featured, .bento-burgundy-edge {
        transition: none !important;
      }
    }
  </style>
</head>

       ========================================================================= */
    let activeAchievementCategory = "All";
    let toastTimer = null;
    let copyButtonTimer = null;

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(message) {
      const container = document.getElementById("toast-container");
      const textEl = document.getElementById("toast-text");
      if (!container || !textEl) return;

      textEl.textContent = message;
      container.classList.remove("opacity-0", "translate-y-3");
      container.classList.add("opacity-100", "translate-y-0");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.add("opacity-0", "translate-y-3");
        container.classList.remove("opacity-100", "translate-y-0");
      }, 2600);
    }

    /**
     * Copies email safely using execCommand('copy') for universal iFrame compatibility.
     */
    function copyEmailAddress(triggerBtn) {
      const email = PORTFOLIO_DATA.profile.email;
      let copied = false;

      try {
        const helper = document.createElement("textarea");
        helper.value = email;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        copied = document.execCommand("copy");
        document.body.removeChild(helper);
      } catch (err) {
        copied = false;
      }

      if (triggerBtn) {
        const labelSpan = triggerBtn.querySelector("[data-copy-label]");
        if (labelSpan) {
          const original = labelSpan.getAttribute("data-original") || labelSpan.textContent;
          labelSpan.setAttribute("data-original", original);
          labelSpan.textContent = "Copied!";
          clearTimeout(copyButtonTimer);
          copyButtonTimer = setTimeout(() => {
            labelSpan.textContent = original;
          }, 2200);
        }
      }

      showToast(copied ? `Copied ${email}` : `Email: ${email}`);
    }

    };

    function getTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      try {
        localStorage.setItem("aaqif_bento_theme", mode);
      } catch (e) {
        // Ignore storage restrictions
      }
      const isDark = mode === "dark";
      const iconEl = document.getElementById("theme-toggle-icon");
      const btnEl = document.getElementById("theme-toggle-btn");
      if (iconEl) iconEl.innerHTML = isDark ? THEME_ICONS.sun : THEME_ICONS.moon;
      if (btnEl) btnEl.setAttribute("aria-label", isDark ? "Switch to Light Mode" : "Switch to Dark Mode");
    }

    function toggleTheme() {
      applyTheme(getTheme() === "dark" ? "light" : "dark");
    }

    /* =========================================================================

       ========================================================================= */
    function toggleMobileDrawer(forceClose = false) {
      const drawer = document.getElementById("mobile-drawer");
      const btn = document.getElementById("mobile-menu-btn");
      const iconOpen = document.getElementById("mobile-icon-open");
      const iconClose = document.getElementById("mobile-icon-close");
      if (!drawer || !btn) return;

      const shouldOpen = forceClose ? false : drawer.classList.contains("hidden");
      drawer.classList.toggle("hidden", !shouldOpen);
      iconOpen.classList.toggle("hidden", shouldOpen);
      iconClose.classList.toggle("hidden", !shouldOpen);
      btn.setAttribute("aria-expanded", String(shouldOpen));
    }

    function handlePortraitError(img) {

      if (fallback) fallback.classList.remove("hidden");
    }

    function handlePortraitPreviewUpload(event) {
      try {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = document.getElementById("hero-portrait-img");
          const fallback = document.getElementById("portrait-fallback");
          if (img && ev.target && ev.target.result) {
            img.src = ev.target.result;
            img.classList.remove("hidden");
            if (fallback) fallback.classList.add("hidden");
            showToast("Portrait preview loaded");
          }
        };
        reader.readAsDataURL(file);
      } catch (err) {
        showToast("Unable to preview selected image");
      }
    }

    /* =========================================================================
       SCROLL SPY & REVEAL OBSERVERS
       ========================================================================= */
    function initScrollObservers() {
      // 1. Active Navigation Pill Highlighting
      const navLinks = Array.from(document.querySelectorAll("#desktop-nav-links [data-nav-target]"));
      const sections = navLinks
        .map(link => document.getElementById(link.getAttribute("data-nav-target")))
        .filter(Boolean);

      if ("IntersectionObserver" in window && sections.length > 0) {
        const navObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.id;
              navLinks.forEach(link => {
                link.classList.toggle("is-active", link.getAttribute("data-nav-target") === id);
              });
            }
          });
        }, { rootMargin: "-22% 0px -62% 0px", threshold: 0 });

        sections.forEach(section => navObserver.observe(section));
      }

      // 2. Smooth Section Reveal
      const revealEls = document.querySelectorAll(".reveal-section");
      if (!("IntersectionObserver" in window)) {
        revealEls.forEach(el => el.classList.add("is-visible"));
      } else {
        const revealObserver = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.06, rootMargin: "0px 0px -24px 0px" });

        revealEls.forEach(el => revealObserver.observe(el));
      }
    }
